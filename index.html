<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoRa Disaster Mesh</title>
  <style>
    :root {
      --bg: #02060f;
      --bg-soft: rgba(7, 12, 23, 0.82);
      --border: rgba(0, 255, 170, 0.24);
      --accent: #00f5b7;
      --accent-2: #10a9ff;
      --text: #edfff9;
      --muted: #7da0b4;
      --danger: #ff5c70;
      --shadow: 0 24px 80px rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(16, 169, 255, 0.16), transparent 22%),
        radial-gradient(circle at bottom, rgba(0, 245, 183, 0.14), transparent 24%),
        linear-gradient(180deg, #010309, #00070f 26%, #00070f);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 255, 183, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 183, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(180deg, rgba(255,255,255,0.7), transparent 85%);
      opacity: 0.35;
    }

    .page-shell {
      width: min(100%, 900px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(4, 8, 18, 0.82);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 14px;
      color: #021016;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 16px rgba(0, 245, 183, 0.35);
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 1.08rem;
    }

    .brand-copy p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.55rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 999px;
      padding: 8px 10px;
      background: rgba(2, 7, 16, 0.95);
      border: 1px solid rgba(16, 169, 255, 0.2);
      font-size: 0.72rem;
      color: #d9f9ff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0, 245, 183, 0.7);
    }

    .chat-main {
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      background: rgba(4, 8, 18, 0.88);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 15px 16px 12px;
      border-bottom: 1px solid rgba(16, 169, 255, 0.18);
    }

    .chat-header-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .chat-subtitle {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chat-header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .device-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a8f5ff;
      background: rgba(16, 169, 255, 0.14);
      border: 1px solid rgba(16, 169, 255, 0.28);
    }

    .chat-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: #ffd47a;
    }

    .chat-log {
      min-height: 320px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        linear-gradient(180deg, rgba(4, 8, 18, 0.95), rgba(3, 7, 16, 0.82));
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: min(86%, 520px);
      padding: 12px 13px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .chat-message.me {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(0, 51, 34, 0.95), rgba(0, 67, 52, 0.88));
      color: #fff;
    }

    .chat-message.remote {
      align-self: flex-start;
      background: rgba(13, 24, 41, 0.96);
      color: #74ffd5;
    }

    .chat-message.system {
      align-self: center;
      background: rgba(52, 11, 16, 0.9);
      color: #ff9dab;
      text-align: center;
    }

    .chat-sender {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 0.48rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.14);
      color: white;
    }

    .chat-body {
      font-size: 0.96rem;
      line-height: 1.28;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 14px;
      border-top: 1px solid rgba(16, 169, 255, 0.16);
      background: rgba(2, 6, 12, 0.9);
    }

    .composer input {
      border-radius: 999px;
      border: 1px solid rgba(16, 169, 255, 0.24);
      background: rgba(3, 9, 18, 0.95);
      color: #fff;
      padding: 12px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .composer input::placeholder {
      color: rgba(154, 184, 208, 0.62);
    }

    .send-btn {
      border-radius: 999px;
      border: none;
      padding: 0 16px;
      font-weight: 800;
      color: #021016;
      background: linear-gradient(180deg, var(--accent), #00b4d4);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 245, 183, 0.22);
    }

    .chat-footer {
      padding: 10px 14px 14px;
      color: #657b8a;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      background: rgba(2, 6, 12, 0.9);
    }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .composer { grid-template-columns: 1fr; }
      .send-btn { min-height: 42px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="topbar">
      <div class="brand-group">
        <div class="brand-icon">◈</div>
        <div class="brand-copy">
          <h1>LoRa Disaster Mesh</h1>
          <p>Offline emergency communication</p>
        </div>
      </div>
      <div class="status-chip" aria-label="status">
        <span class="status-dot"></span>
        <span>Offline • local only</span>
      </div>
    </div>

    <section class="chat-main" aria-label="chat">
      <div class="chat-header">
        <div class="chat-header-copy">
          <span class="chat-title">LoRa Disaster Mesh</span>
          <span class="chat-subtitle">Offline 2-user chat • no network required</span>
        </div>
        <div class="chat-header-meta">
          <span class="device-pill">You • Local device</span>
          <span class="chat-status" id="activeStatus"><span class="status-dot"></span><span>Offline • ready</span></span>
        </div>
      </div>

      <div class="chat-log" id="chatLog" aria-live="polite"></div>

      <form class="composer" id="messageForm">
        <input id="messageInput" type="text" maxlength="220" placeholder="Type a message for your partner" autocomplete="off" aria-label="Chat message" />
        <button class="send-btn" type="submit">SEND</button>
      </form>

      <div class="chat-footer">Offline Emergency Communication System</div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
